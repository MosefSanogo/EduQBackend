
services:
  # Ton Backend Node.js / Express
  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env  
    environment:
      - PORT=5000
      - DB_HOST=mysql_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - DB_NAME=${DB_NAME}
    depends_on:
      - mysql_db
    restart: always

  # Ton conteneur MySQL
  mysql_db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # <--- Importe tes tables automatiquement
    restart: always

volumes:
  mysql_data: